name: Build Tank Battle Executables

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"          # Kích hoạt khi push tag dạng v1.0, v2.1.3, ...
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # Cho phép chạy thủ công từ tab Actions trên GitHub

permissions:
  contents: write      # Cần để tạo GitHub Release

jobs:
  # ─────────────────────────────────────────────
  #  Job 1: Build Windows .exe
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame>=2.5.0 pyinstaller pillow

      - name: 🔨 Build Windows executable
        run: |
          pyinstaller --clean tank_battle.spec

      - name: ✅ Verify output exists
        shell: pwsh
        run: |
          $exe = "dist\TankBattle.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: $exe not found!"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "✅ TankBattle.exe built successfully — $([math]::Round($size,1)) MB"

      - name: 📤 Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankBattle-Windows
          path: dist/TankBattle.exe
          retention-days: 30

  # ─────────────────────────────────────────────
  #  Job 2: Build Linux binary
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (ELF)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 🔧 Install system SDL2 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libfreetype6-dev libportmidi-dev

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame>=2.5.0 pyinstaller

      - name: 🔨 Build Linux executable
        run: |
          pyinstaller --clean tank_battle.spec

      - name: ✅ Verify output exists
        run: |
          if [ ! -f dist/TankBattle ]; then
            echo "❌ Build failed: dist/TankBattle not found!"
            exit 1
          fi
          size=$(du -sh dist/TankBattle | cut -f1)
          echo "✅ TankBattle built successfully — ${size}"

      - name: 📤 Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankBattle-Linux
          path: dist/TankBattle
          retention-days: 30

  # ─────────────────────────────────────────────
  #  Job 3: Tạo GitHub Release (chỉ khi push tag)
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TankBattle-Windows
          path: release/

      - name: 📥 Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: TankBattle-Linux
          path: release/

      - name: 🏷️ Rename Linux binary
        run: mv release/TankBattle release/TankBattle-linux

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tank Battle ${{ github.ref_name }}"
          body: |
            ## 🎮 Tank Battle — ${{ github.ref_name }}

            ### Tải xuống
            | Hệ điều hành | File |
            |---|---|
            | 🪟 Windows | `TankBattle.exe` |
            | 🐧 Linux   | `TankBattle-linux` |

            ### Cách chạy (Linux)
            ```bash
            chmod +x TankBattle-linux
            ./TankBattle-linux
            ```
          files: |
            release/TankBattle.exe
            release/TankBattle-linux
          draft: false
          prerelease: false
